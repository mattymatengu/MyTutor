<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MyTutor connects NUST students with approved peer tutors for their modules.">
    <title>Apply for tutoring | MyTutor</title>
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="sr-only" href="#main">Skip to content</a>
<header class="site-header">
    <nav class="container nav" aria-label="Main navigation">
        <a class="logo" href="index.html"><img class="logo-mark" src="images/logo.svg" alt="" width="34" height="34"><span class="logo-text">My<span>Tutor</span></span></a>
        <button class="nav-toggle" id="navToggle" type="button" aria-expanded="false" aria-controls="navLinks" aria-label="Toggle menu">&#9776;</button>
        <ul class="nav-links" id="navLinks">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="modules.html">Modules</a></li>
            <li><a href="tutors.html">Tutors</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li id="authLinks" class="auth-slot"></li>
        </ul>
    </nav>
</header>
<main id="main">

<section class="container">
    <div class="card form-card wide">
        <h1>Apply for tutoring</h1>
        <p class="hint">Tell us what you need so a tutor can decide quickly.</p>
        <form id="applyForm" class="mt" novalidate>
            <div class="form-row">
                <div class="field"><label for="moduleId">Module</label><select id="moduleId" name="moduleId" required><option value="">Choose a module...</option></select></div>
                <div class="field"><label for="tutorId">Preferred tutor <span class="hint">(optional)</span></label><select id="tutorId" name="tutorId"><option value="">Any approved tutor</option></select></div>
            </div>
            <div class="form-row">
                <div class="field"><label for="currentLevel">Your current level</label><select id="currentLevel" name="currentLevel" required>
                    <option value="">Choose...</option><option>Struggling</option><option>Getting by</option><option>Doing well, want more</option></select></div>
                <div class="field"><label for="availability">When are you available?</label><input type="text" id="availability" name="availability" maxlength="200" placeholder="e.g. Weekdays after 16:00" required></div>
            </div>
            <div class="field"><label for="message">What do you need help with?</label><textarea id="message" name="message" maxlength="1000" required placeholder="Topics, assignments, upcoming tests..."></textarea><span class="hint"><span id="msgCount">0</span>/1000</span></div>
            <button class="btn" type="submit">Submit application</button>
            <p id="formStatus" class="status" role="status" aria-live="polite"></p>
        </form>
    </div>
</section>
</main>
<footer class="site-footer">
    <div class="container footer-inner">
        <div>
            <strong>MyTutor</strong>
            <p>Peer tutoring for NUST students. &copy; <span id="year">2026</span> MyTutor.</p>
        </div>
        <ul class="footer-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="modules.html">Modules</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </div>
</footer>
<script src="js/app.js"></script>
<script src="js/apply.js"></script>
</body>
</html>
