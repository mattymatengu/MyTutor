<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MyTutor connects NUST students with approved peer tutors for their modules.">
    <title>Reset password | MyTutor</title>
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="sr-only" href="#main">Skip to content</a>
<header class="site-header">
    <nav class="container nav" aria-label="Main navigation">
        <a class="logo" href="index.html"><img class="logo-mark" src="images/logo.svg" alt="" width="34" height="34"><span class="logo-text">My<span>Tutor</span></span></a>
        <button class="nav-toggle" id="navToggle" type="button" aria-expanded="false" aria-controls="navLinks" aria-label="Toggle menu">&#9776;</button>
        <ul class="nav-links" id="navLinks">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="modules.html">Modules</a></li>
            <li><a href="tutors.html">Tutors</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li id="authLinks" class="auth-slot"></li>
        </ul>
    </nav>
</header>
<main id="main">

<section class="container">
    <div class="card form-card">
        <h1>Choose a new password</h1>
        <form id="resetForm" class="mt" novalidate>
            <div class="field"><label for="password">New password <span class="hint">(8+ characters, a letter and a number)</span></label><input type="password" id="password" name="password" autocomplete="new-password" required minlength="8"></div>
            <div class="field"><label for="confirm">Confirm new password</label><input type="password" id="confirm" name="confirm" autocomplete="new-password" required></div>
            <button class="btn" type="submit">Change password</button>
            <p id="formStatus" class="status" role="status" aria-live="polite"></p>
        </form>
    </div>
</section>
</main>
<footer class="site-footer">
    <div class="container footer-inner">
        <div>
            <strong>MyTutor</strong>
            <p>Peer tutoring for NUST students. &copy; <span id="year">2026</span> MyTutor.</p>
        </div>
        <ul class="footer-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="modules.html">Modules</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </div>
</footer>
<script src="js/app.js"></script>
<script src="js/reset.js"></script>
</body>
</html>
